<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>같이 성장 북마크</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="description" content="팀에서 함께 보는 링크 모음. URL과 작성자만 넣으면 제목과 섬네일이 자동으로 붙어요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 다른 마법사와 같은 LINE 디자인 기준: 포인트 #1775F0 + Black + Gray, 상태는 opacity(hover 70% / pressed 50%), 모서리 5px(카드 12px) */
* {box-sizing: border-box;}
body {margin: 0; font-family: 'LINE Seed KR', 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', 'Malgun Gothic', sans-serif; font-size: 14px; line-height: 21px; color: #000000; background: #F5F5F5; -webkit-font-smoothing: antialiased;}
::selection {background: #CFE2FC; color: #000000;}
:focus-visible {outline: 2px solid #3182F6; outline-offset: 2px;}
.skip-nav {position: absolute; left: 0; top: -100%; z-index: 100; width: 100%; padding: 12px 0; background: #3182F6; color: #ffffff; text-align: center;}
.skip-nav:focus {top: 0;}
.sr-only {position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;}

/* ---- 헤더 ---- */
.hdr {position: sticky; top: 0; z-index: 5; display: flex; align-items: center; min-height: 56px; padding: 0 24px; border-bottom: 1px solid #EFEFEF; background: #FFFFFF;}
.hdr_title {display: flex; align-items: center; gap: 12px; min-width: 0; margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap;}
.hdr_home {flex: 0 0 auto; padding-right: 12px; border-right: 1px solid #DFDFDF; font-size: 14px; font-weight: 500; color: #777777; text-decoration: none; transition: opacity .15s ease;}
.hdr_home::before {content: "‹ ";}
.hdr_home:hover {opacity: .7;}

/* ---- 본문 ---- */
.main {display: grid; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 16px 16px 48px;}
.notice {margin: 0; padding: 12px 16px; border-radius: 5px; font-size: 13px; line-height: 20px; color: #555555; background: #FFF6DA;}
.notice[hidden] {display: none;}

.hdr_user {display: flex; align-items: center; gap: 8px; min-width: 0; margin: 0 0 0 auto; font-size: 12px; line-height: 16px; color: #777777;}
.hdr_user[hidden] {display: none;}
.hdr_email {overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.hdr_logout {flex: 0 0 auto; padding: 4px 6px; border: 0; border-radius: 5px; font-family: inherit; font-size: 12px; color: #777777; background: transparent; cursor: pointer; transition: opacity .15s ease;}
.hdr_logout:hover {opacity: .7;}

/* ---- 회사 메일 인증 ---- */
.login {display: grid; gap: 16px; width: 100%; max-width: 420px; margin: 48px auto 0; padding: 32px 24px; border-radius: 12px; background: #FFFFFF;}
.login[hidden] {display: none;}
.login_title {margin: 0; font-size: 20px; line-height: 28px; font-weight: 700;}
.login_desc {margin: 0; font-size: 14px; line-height: 21px; color: #777777;}
.login_form {display: grid; gap: 8px;}
.login_form[hidden] {display: none;}
.login_label {font-size: 12px; line-height: 16px; font-weight: 500; color: #777777;}
.login_row {display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px;}
.login_code {font-size: 18px; letter-spacing: .3em; font-variant-numeric: tabular-nums;}
.login_again {justify-self: start; padding: 4px 0; border: 0; font-family: inherit; font-size: 12px; color: #777777; text-decoration: underline; background: transparent; cursor: pointer; transition: opacity .15s ease;}
.login_again:hover {opacity: .7;}
.app {display: grid; gap: 16px; min-width: 0;}
.app[hidden] {display: none;}

/* ---- 등록 폼 ---- */
.add {display: grid; gap: 8px; padding: 20px 24px; border-radius: 12px; background: #FFFFFF;}
.add_title {margin: 0; font-size: 18px; line-height: 24px; font-weight: 700;}
.add_row {display: grid; grid-template-columns: minmax(0, 1fr) 180px auto; gap: 8px;}
.add_hint {margin: 0; font-size: 12px; line-height: 18px; color: #949494;}
.add_status:empty {display: none;}
.add_status {min-height: 18px; margin: 0; font-size: 12px; line-height: 18px; font-weight: 500; color: #1775F0;}
.add_status-error {color: #E8332E;}
.input {display: block; width: 100%; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid transparent; border-radius: 5px; font-family: inherit; font-size: 14px; color: #000000; background: #F5F5F5; transition: border-color .15s ease;}
.input::placeholder {color: #C8C8C8;}
.input:focus {outline: none; border-color: #1775F0; background: #FFFFFF;}
.input:focus-visible {outline: none;}

/* ---- 버튼 ---- */
.btn {display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 20px; border: 1px solid #1775F0; border-radius: 5px; font-family: inherit; font-size: 14px; font-weight: 700; white-space: nowrap; color: #FFFFFF; background: #1775F0; cursor: pointer; transition: opacity .15s ease;}
.btn:hover:not(:disabled) {opacity: .7;}
.btn:active:not(:disabled) {opacity: .5;}
.btn:disabled {border-color: #E4E4E4; color: #949494; background: #E4E4E4; cursor: default;}

/* ---- 공간 탭 + 검색 (한 줄) ---- */
.toolbar {display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid #DFDFDF;}
.tabs {display: flex; gap: 24px;}
.tab {position: relative; padding: 8px 0 12px; border: 0; font-family: inherit; font-size: 16px; line-height: 24px; font-weight: 700; color: #949494; background: transparent; cursor: pointer; transition: opacity .15s ease;}
.tab:hover {opacity: .7;}
.tab small {margin-left: 4px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;}
.tab[aria-selected="true"] {color: #000000;}
.tab[aria-selected="true"] small {color: #1775F0;}
.tab[aria-selected="true"]::after {content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #000000;}
.toolbar_search {flex: 0 1 240px; min-width: 0; padding-bottom: 8px;}
.toolbar_search .input {height: 36px; background: #FFFFFF;}
.card_title mark {border-radius: 2px; color: inherit; background: #FFE58A;}

/* ---- 북마크 카드 ---- */
.list {display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin: 0; padding: 0; list-style: none;}
.card {display: flex; flex-direction: column; min-width: 0; overflow: hidden; border-radius: 12px; background: #FFFFFF;}
.card_link {display: flex; flex: 1; flex-direction: column; color: #000000; text-decoration: none; transition: opacity .15s ease;}
.card_link:hover {opacity: .7;}
.card_link:active {opacity: .5;}
.card_thumb {position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; background: #EFEFEF;}
.card_thumb img {display: block; width: 100%; height: 100%; object-fit: cover; object-position: top;}
.card_thumb-loading::after {content: "캡쳐 중…"; position: absolute; right: 8px; bottom: 8px; padding: 2px 6px; border-radius: 5px; font-size: 11px; line-height: 16px; color: #FFFFFF; background: rgba(0, 0, 0, .55);}
.card_fallback {position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 600; color: #777777;}
.card_fallback img {width: 32px; height: 32px; border-radius: 6px; object-fit: contain;}
.card_body {display: flex; flex: 1; flex-direction: column; gap: 6px; padding: 16px 16px 0;}
.card_title {display: -webkit-box; margin: 0; overflow: hidden; font-size: 15px; line-height: 21px; font-weight: 700; word-break: break-all; -webkit-box-orient: vertical; -webkit-line-clamp: 2;}
.card_host {display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; line-height: 16px; color: #777777;}
.card_host img {flex: 0 0 auto; border-radius: 3px;}
.card_host span {overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.card_host::after {content: "↗"; margin-left: auto; color: #1775F0;}
.card_meta {display: grid; gap: 10px; padding: 12px 16px 16px;}
.card_foot {display: flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; line-height: 16px; color: #949494;}
.card_author {font-weight: 600; color: #555555;}
.card_del {margin-left: auto; padding: 4px 6px; border: 0; border-radius: 5px; font-family: inherit; font-size: 12px; color: #949494; background: transparent; cursor: pointer; transition: opacity .15s ease;}
.card_del:hover {opacity: .7; color: #E8332E;}
.card_move, .card_del {opacity: 0;}
.card:hover .card_move, .card:hover .card_del, .card:focus-within .card_move, .card:focus-within .card_del {opacity: 1;}
@media (hover: none) {.card_move, .card_del {opacity: 1;}}
.card_move {margin-left: auto; padding: 4px 6px; border: 0; border-radius: 5px; font-family: inherit; font-size: 12px; color: #949494; background: transparent; cursor: pointer; transition: opacity .15s ease;}
.card_move:hover {opacity: .7; color: #1775F0;}
.card_move + .card_del {margin-left: 0;}

.empty {padding: 48px 16px; border-radius: 12px; text-align: center; color: #949494; background: #FFFFFF;}
.empty[hidden] {display: none;}

@media (max-width: 767px) {
    .hdr {padding: 0 16px;}
    .hdr_email {display: none;}
    .login {margin-top: 24px; padding: 24px 16px;}
    .add {padding: 16px;}
    .add_row {grid-template-columns: 1fr 1fr;}
    .add_row .input-url {grid-column: 1 / -1;}
    .toolbar_search {flex-basis: 100%; order: -1; padding-bottom: 0;}
    .tabs {gap: 16px;}
    .list {grid-template-columns: 1fr;}
}
@media (prefers-reduced-motion: reduce) {
    * {transition: none; animation: none;}
}
</style>
</head>
<body>
<a href="#main-content" class="skip-nav">본문 바로가기</a>

<header class="hdr">
    <h1 class="hdr_title"><a class="hdr_home" href="../">도구 모음</a>같이 성장 북마크</h1>
    <p class="hdr_user" data-user hidden>
        <span class="hdr_email" data-user-email></span>
        <button class="hdr_logout" type="button" data-logout>로그아웃</button>
    </p>
</header>

<main class="main" id="main-content">
    <section class="login" aria-labelledby="loginTitle" data-login hidden>
        <h2 class="login_title" id="loginTitle">회사 메일로 들어오기</h2>
        <p class="login_desc">YBM 임직원만 볼 수 있어요. 회사 메일로 받은 인증번호를 넣으면, 이 브라우저에서는 90일 동안 다시 묻지 않아요.</p>
        <form class="login_form" data-login-email-form novalidate>
            <label class="login_label" for="loginEmail">회사 메일</label>
            <div class="login_row">
                <input class="input" id="loginEmail" type="email" inputmode="email" placeholder="이름@ybm.co.kr" autocomplete="email" required data-login-email>
                <button class="btn" type="submit" data-login-send>인증번호 받기</button>
            </div>
        </form>
        <form class="login_form" data-login-code-form novalidate hidden>
            <label class="login_label" for="loginCode">메일로 받은 인증번호 6자리</label>
            <div class="login_row">
                <input class="input login_code" id="loginCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="one-time-code" required data-login-code>
                <button class="btn" type="submit" data-login-verify>확인</button>
            </div>
            <button class="login_again" type="button" data-login-again>메일 주소 바꾸기 · 다시 받기</button>
        </form>
        <p class="add_status" data-login-status role="status" aria-live="polite"></p>
    </section>

    <div class="app" data-app hidden>
    <p class="notice" data-notice hidden>지금은 <strong>체험 모드</strong>예요. 등록한 북마크가 이 브라우저에만 저장돼요. 팀 공유는 <code>bookmark/README.md</code>대로 Google 시트를 연결하면 시작돼요.</p>

    <section class="add" aria-labelledby="addTitle">
        <h2 class="add_title" id="addTitle">링크 등록</h2>
        <form class="add_row" data-add-form novalidate>
            <label class="sr-only" for="bmUrl">URL</label>
            <input class="input input-url" id="bmUrl" name="url" type="url" inputmode="url" placeholder="https://공유할-링크" autocomplete="off" required data-add-url>
            <label class="sr-only" for="bmAuthor">작성자</label>
            <input class="input" id="bmAuthor" name="author" type="text" maxlength="20" placeholder="작성자" autocomplete="name" required data-add-author>
            <button class="btn" type="submit" data-add-submit>등록</button>
        </form>
        <p class="add_hint">지금 보고 있는 탭에 등록돼요. 제목과 섬네일은 자동으로 붙어요.</p>
        <p class="add_status" data-add-status role="status" aria-live="polite"></p>
    </section>

    <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="공간">
            <button class="tab" type="button" role="tab" id="tab-use" aria-controls="bmList" data-tab="use">바로 쓰기<small data-tab-count="use"></small></button>
            <button class="tab" type="button" role="tab" id="tab-learn" aria-controls="bmList" data-tab="learn">보고 배우기<small data-tab-count="learn"></small></button>
        </div>
        <div class="toolbar_search">
            <label class="sr-only" for="bmSearch">북마크 검색</label>
            <input class="input" id="bmSearch" type="search" placeholder="검색" autocomplete="off" data-search>
        </div>
        <p class="sr-only" data-count aria-live="polite"></p>
    </div>

    <ul class="list" id="bmList" role="tabpanel" data-list></ul>
    <p class="empty" data-empty hidden>아직 북마크가 없어요.</p>
    </div>
</main>

<script>
// Apps Script 웹 앱 주소 (README 3단계에서 받은 /exec 주소). 비워 두면 체험 모드(이 브라우저에만 저장)
const API_URL = 'https://script.google.com/macros/s/AKfycbxOZC1ytd7fiKOWarenPwMSv3F7YBZoSl20MgrTYXIJONil_6yTGWqyPm0IsrCJW8eZ/exec';

const LOCAL_KEY = 'bookmark.items';
const AUTHOR_KEY = 'bookmark.author';
const SESSION_KEY = 'bookmark.session';
const THUMB_RETRY = 5;
const SPACE_KEY = 'bookmark.space';

// 공간: 바로 쓰기(use) / 보고 배우기(learn)
const SPACE_NAMES = {use: '바로 쓰기', learn: '보고 배우기'};
// 이 사이트들은 '보고 배우기'가 미리 골라져요 (apps-script.gs 의 REFERENCE_HOSTS 와 같이 고쳐 주세요)
const REFERENCE_HOSTS = ['uiverse.io', 'dribbble.com', 'behance.net', 'awwwards.com', 'codepen.io', 'mobbin.com',
    'pinterest.com', 'pinterest.co.kr', 'land-book.com', 'godly.website', 'siteinspire.com', 'cssdesignawards.com',
    'onepagelove.com', 'lapa.ninja', 'httpster.net', 'refero.design', 'pageflows.com', 'uibowl.io', 'saasframe.io'];

const state = {items: [], query: '', space: 'use'};

// 서버가 로그인 만료를 알릴 때 쓰는 오류
class AuthError extends Error {}

// localStorage는 사생활 보호 모드 등에서 막힐 수 있어 감싸요
function readStorage(key, fallback) {
    try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
    } catch (err) {
        return fallback;
    }
}

function writeStorage(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
    } catch (err) {
        // 저장이 안 돼도 화면은 그대로 동작해요
    }
}

function getHost(url) {
    try {
        return new URL(url).hostname.replace(/^www\./, '');
    } catch (err) {
        return url;
    }
}

function normalizeUrl(raw) {
    let url = raw.trim();
    if (url && !/^https?:\/\//i.test(url)) url = `https://${url}`;
    try {
        const parsed = new URL(url);
        return /^https?:$/.test(parsed.protocol) && parsed.hostname.includes('.') ? parsed.href : '';
    } catch (err) {
        return '';
    }
}

function guessSpace(url) {
    const host = getHost(url).toLowerCase();
    return REFERENCE_HOSTS.some((ref) => host === ref || host.endsWith(`.${ref}`)) ? 'learn' : 'use';
}

function spaceOf(item) {
    return SPACE_NAMES[item.space] ? item.space : guessSpace(item.url);
}

function formatDate(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return '';
    return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
}

// 캡쳐 섬네일: WordPress mShots (무료, 이미지 저장 없이 URL만으로 캡쳐)
function getThumbUrl(url, attempt) {
    const bust = attempt ? `&r=${attempt}` : '';
    return `https://s0.wp.com/mshots/v1/${encodeURIComponent(url)}?w=640&h=400&vpw=1280&vph=800${bust}`;
}

// 유튜브 영상 ID (watch·youtu.be·shorts·embed·live 주소)
function getYoutubeId(url) {
    const match = String(url).match(/^https?:\/\/(?:[\w-]+\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i);
    return match ? match[1] : '';
}

// 유튜브 제목은 화면에서 바로 받아와요 (noembed: CORS를 허용하는 oEmbed 중계). 이미 등록한 카드도 진짜 제목으로 보여요
const youtubeTitles = {};
async function fillYoutubeTitle(item, titleEl) {
    try {
        youtubeTitles[item.url] = youtubeTitles[item.url] || fetch(`https://noembed.com/embed?url=${encodeURIComponent(item.url)}`).then((res) => res.json());
        const data = await youtubeTitles[item.url];
        if (data && data.title) {
            item.title = data.title;
            highlight(titleEl, data.title, getTerms(state.query));
        }
    } catch (err) {
        // 못 받아오면 시트에 저장된 제목을 그대로 둬요
    }
}

function getFaviconUrl(url) {
    return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(getHost(url))}&sz=64`;
}

// ---- 저장소: Google 시트(API) 또는 체험 모드(localStorage) ----
async function requestApi(payload) {
    const res = await fetch(API_URL, {
        method: 'POST',
        // text/plain이면 사전 요청(CORS preflight) 없이 Apps Script로 보낼 수 있어요
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        // 로그인 토큰은 주소(URL)가 아니라 본문에만 담아요
        body: JSON.stringify({...payload, token: readStorage(SESSION_KEY, {}).token || ''})
    });
    const data = await res.json();
    if (data.code === 'AUTH') throw new AuthError(data.message);
    if (!data.ok) throw new Error(data.message || '요청을 처리하지 못했어요.');
    return data;
}

async function loadItems() {
    if (!API_URL) return readStorage(LOCAL_KEY, []);
    return (await requestApi({action: 'list'})).items;
}

async function addItem(url, author, space) {
    if (API_URL) return (await requestApi({action: 'add', url, author, space})).item;

    // 체험 모드: 페이지를 읽을 수 없어 주소에서 제목·키워드를 만들어요
    const items = readStorage(LOCAL_KEY, []);
    if (items.some((item) => item.url.replace(/\/$/, '') === url.replace(/\/$/, ''))) throw new Error('이미 등록된 링크예요.');
    const item = {
        id: Math.random().toString(36).slice(2, 10),
        createdAt: new Date().toISOString(),
        url,
        title: getHost(url),
        description: '',
        keywords: extractLocalKeywords(url),
        author,
        space
    };
    writeStorage(LOCAL_KEY, [item, ...items]);
    return item;
}

async function moveItem(id, space) {
    if (API_URL) {
        await requestApi({action: 'move', id, space});
        return;
    }
    writeStorage(LOCAL_KEY, readStorage(LOCAL_KEY, []).map((item) => (item.id === id ? {...item, space} : item)));
}

async function deleteItem(id) {
    if (API_URL) {
        await requestApi({action: 'delete', id});
        return;
    }
    writeStorage(LOCAL_KEY, readStorage(LOCAL_KEY, []).filter((item) => item.id !== id));
}

function extractLocalKeywords(url) {
    const parsed = new URL(url);
    const words = `${parsed.hostname.replace(/^www\./, '').split('.')[0]} ${decodeURIComponent(parsed.pathname)}`
        .toLowerCase()
        .split(/[^0-9a-z가-힣]+/)
        .filter((word) => word.length >= 2 && !/^\d+$/.test(word) && !['html', 'php', 'index', 'www'].includes(word));
    return [...new Set(words)].slice(0, 5);
}

// ---- 화면 그리기 ----
function createThumb(item) {
    const thumb = document.createElement('span');
    thumb.className = 'card_thumb card_thumb-loading';

    const img = document.createElement('img');
    img.alt = '';
    img.width = 640;
    img.height = 400;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    let attempt = 0;
    thumb.appendChild(img);

    // 유튜브는 캡쳐 대신 영상 섬네일을 써요. 고화질(maxres)이 없는 영상은 mq(320px)로 바꿔요
    const youtubeId = getYoutubeId(item.url);
    if (youtubeId) {
        const useMq = () => { img.src = `https://i.ytimg.com/vi/${youtubeId}/mqdefault.jpg`; };
        img.addEventListener('load', () => {
            if (img.naturalWidth <= 120 && !img.src.includes('mqdefault')) return useMq();
            thumb.classList.remove('card_thumb-loading');
        });
        img.addEventListener('error', () => {
            if (!img.src.includes('mqdefault')) return useMq();
            showFallback();
        });
        img.src = `https://i.ytimg.com/vi/${youtubeId}/maxresdefault.jpg`;
        return thumb;
    }

    // 1) 봇 차단 사이트: 캡쳐해도 차단 화면만 찍혀서 바로 파비콘으로 보여줘요
    //    (예전에 등록한 글은 제목을 못 가져온 경우 = 페이지를 못 읽은 경우로 판단해요)
    const unreadable = !item.image && !item.description && (!item.title || item.title === getHost(item.url));
    if (item.image === 'none' || unreadable) {
        showFallback();
        return thumb;
    }

    // 2) 대표이미지(og:image)가 있으면 그걸 쓰고, 못 불러오면 캡쳐로 넘어가요
    if (/^https?:\/\//i.test(item.image || '')) {
        const onImage = () => thumb.classList.remove('card_thumb-loading');
        img.addEventListener('load', onImage);
        img.addEventListener('error', () => {
            img.removeEventListener('load', onImage);
            listenCapture();
            img.src = getThumbUrl(item.url, 0);
        }, {once: true});
        img.src = item.image;
        return thumb;
    }

    // 3) 둘 다 없으면 캡쳐
    listenCapture();
    img.src = getThumbUrl(item.url, 0);
    return thumb;

    // mShots는 처음 요청 때 '생성 중' 이미지를 주므로, 실제 캡쳐(640px)가 올 때까지 몇 번 다시 불러요
    function listenCapture() {
        img.addEventListener('load', () => {
            if (img.naturalWidth === 640) {
                thumb.classList.remove('card_thumb-loading');
                return;
            }
            if (attempt >= THUMB_RETRY) {
                showFallback();
                return;
            }
            attempt += 1;
            setTimeout(() => { img.src = getThumbUrl(item.url, attempt); }, 3000 * attempt);
        });
        img.addEventListener('error', showFallback);
    }

    function showFallback() {
        thumb.classList.remove('card_thumb-loading');
        img.remove();
        const box = document.createElement('span');
        box.className = 'card_fallback';
        const icon = document.createElement('img');
        icon.src = getFaviconUrl(item.url);
        icon.alt = '';
        icon.width = 32;
        icon.height = 32;
        const host = document.createElement('span');
        host.textContent = getHost(item.url);
        box.append(icon, host);
        thumb.appendChild(box);
    }
}

function createCard(item, myName) {
    const card = document.createElement('li');
    card.className = 'card';

    const link = document.createElement('a');
    link.className = 'card_link';
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.title = item.description || item.title;

    const body = document.createElement('span');
    body.className = 'card_body';
    const title = document.createElement('h3');
    title.className = 'card_title';
    highlight(title, item.title || getHost(item.url), getTerms(state.query));
    if (getYoutubeId(item.url)) fillYoutubeTitle(item, title);
    const host = document.createElement('span');
    host.className = 'card_host';
    const favicon = document.createElement('img');
    favicon.src = getFaviconUrl(item.url);
    favicon.alt = '';
    favicon.width = 16;
    favicon.height = 16;
    favicon.loading = 'lazy';
    const hostText = document.createElement('span');
    hostText.textContent = getHost(item.url);
    const newWindow = document.createElement('span');
    newWindow.className = 'sr-only';
    newWindow.textContent = '(새 창)';
    host.append(favicon, hostText, newWindow);
    body.append(title, host);
    link.append(createThumb(item), body);

    const meta = document.createElement('div');
    meta.className = 'card_meta';
    const foot = document.createElement('p');
    foot.className = 'card_foot';
    const author = document.createElement('span');
    author.className = 'card_author';
    author.textContent = item.author;
    const date = document.createElement('time');
    date.dateTime = item.createdAt;
    date.textContent = formatDate(item.createdAt);
    foot.append(author, date);
    // 내가 올린 글(서버가 회사 메일로 확인)에만 삭제 버튼을 보여줘요. 체험 모드는 작성자 이름으로 비교해요
    if (API_URL ? item.mine : (myName && item.author === myName)) {
        const target = spaceOf(item) === 'use' ? 'learn' : 'use';
        const move = document.createElement('button');
        move.type = 'button';
        move.className = 'card_move';
        move.dataset.moveId = item.id;
        move.dataset.moveTo = target;
        move.textContent = '옮기기';
        move.title = `${SPACE_NAMES[target]}로 옮기기`;
        move.setAttribute('aria-label', `${item.title}을(를) ${SPACE_NAMES[target]}로 옮기기`);
        foot.appendChild(move);

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'card_del';
        del.dataset.deleteId = item.id;
        del.textContent = '삭제';
        del.setAttribute('aria-label', `${item.title} 삭제`);
        foot.appendChild(del);
    }
    meta.appendChild(foot);

    card.append(link, meta);
    return card;
}

// ---- 검색: 띄어 쓴 단어가 모두 들어간 글만, 한글 초성(ㅂㄹㄷ)으로도 찾아요 ----
const CHOSEONG = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function toChoseong(text) {
    return Array.from(text, (ch) => {
        const code = ch.charCodeAt(0) - 0xAC00;
        return code >= 0 && code < 11172 ? CHOSEONG[Math.floor(code / 588)] : ch;
    }).join('');
}

function getTerms(query) {
    return query.trim().toLowerCase().split(/\s+/).filter(Boolean);
}

function matchesTerms(item, terms) {
    const text = [item.title, getHost(item.url), item.url, item.description, item.author].join(' ').toLowerCase();
    const initials = toChoseong(text);
    return terms.every((term) => text.includes(term) || (/^[ㄱ-ㅎ]+$/.test(term) && initials.includes(term)));
}

// 제목에서 찾은 단어를 형광펜으로 칠해요 (초성 검색은 칠하지 않아요)
function highlight(el, text, terms) {
    const words = terms.filter((term) => !/^[ㄱ-ㅎ]+$/.test(term)).map((term) => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!words.length) {
        el.textContent = text;
        return;
    }
    const re = new RegExp(`(${words.join('|')})`, 'gi');
    el.replaceChildren(...text.split(re).filter(Boolean).map((part) => {
        if (!re.test(part)) return document.createTextNode(part);
        re.lastIndex = 0;
        const mark = document.createElement('mark');
        mark.textContent = part;
        return mark;
    }));
}

function render() {
    const terms = getTerms(state.query);
    const q = terms.length > 0;
    const myName = readStorage(AUTHOR_KEY, '');
    const inSpace = state.items.filter((item) => spaceOf(item) === state.space);
    const matched = q ? inSpace.filter((item) => matchesTerms(item, terms)) : inSpace;

    document.querySelectorAll('[data-tab]').forEach((tab) => {
        const on = tab.dataset.tab === state.space;
        tab.setAttribute('aria-selected', String(on));
        tab.tabIndex = on ? 0 : -1;
    });
    Object.keys(SPACE_NAMES).forEach((space) => {
        document.querySelector(`[data-tab-count="${space}"]`).textContent = state.items.filter((item) => spaceOf(item) === space).length;
    });
    document.querySelector('[data-list]').setAttribute('aria-labelledby', `tab-${state.space}`);

    document.querySelector('[data-list]').replaceChildren(...matched.map((item) => createCard(item, myName)));
    const emptyEl = document.querySelector('[data-empty]');
    emptyEl.hidden = matched.length > 0;
    emptyEl.textContent = inSpace.length ? '조건에 맞는 북마크가 없어요.' : `아직 '${SPACE_NAMES[state.space]}'에 북마크가 없어요. 첫 링크를 등록해 보세요.`;
    document.querySelector('[data-count]').textContent = q ? `검색 결과 ${matched.length}개` : `북마크 ${inSpace.length}개`;
}

function setSpace(space) {
    state.space = SPACE_NAMES[space] ? space : 'use';
    writeStorage(SPACE_KEY, state.space);
    render();
}

function setStatus(message, isError) {
    const el = document.querySelector('[data-add-status]');
    el.textContent = message;
    el.classList.toggle('add_status-error', Boolean(isError));
}

async function refresh() {
    try {
        state.items = await loadItems();
    } catch (err) {
        if (err instanceof AuthError) {
            showLogin(err.message);
            return;
        }
        setStatus(err.message || '목록을 불러오지 못했어요.', true);
    }
    render();
}

// ---- 회사 메일 인증 ----
function setLoginStatus(message, isError) {
    const el = document.querySelector('[data-login-status]');
    el.textContent = message;
    el.classList.toggle('add_status-error', Boolean(isError));
}

function showLogin(message) {
    writeStorage(SESSION_KEY, {});
    state.items = [];
    document.querySelector('[data-app]').hidden = true;
    document.querySelector('[data-user]').hidden = true;
    document.querySelector('[data-login]').hidden = false;
    document.querySelector('[data-login-email-form]').hidden = false;
    document.querySelector('[data-login-code-form]').hidden = true;
    setLoginStatus(message || '', Boolean(message));
    document.querySelector('[data-login-email]').focus();
}

function showApp() {
    const session = readStorage(SESSION_KEY, {});
    document.querySelector('[data-login]').hidden = true;
    document.querySelector('[data-app]').hidden = false;
    document.querySelector('[data-user]').hidden = !session.email;
    document.querySelector('[data-user-email]').textContent = session.email || '';
    // 작성자 칸이 비어 있으면 메일 아이디로 채워요 (고쳐 쓸 수 있어요)
    const authorEl = document.querySelector('[data-add-author]');
    if (!authorEl.value && session.email) authorEl.value = session.email.split('@')[0];
    refresh();
}

async function handleSendCode(event) {
    event.preventDefault();
    const emailEl = document.querySelector('[data-login-email]');
    const sendEl = document.querySelector('[data-login-send]');
    const email = emailEl.value.trim().toLowerCase();
    if (!/^[^\s@]+@ybm\.co\.kr$/.test(email)) {
        setLoginStatus('회사 메일(@ybm.co.kr)을 입력해 주세요.', true);
        emailEl.focus();
        return;
    }
    sendEl.disabled = true;
    setLoginStatus('인증번호를 보내는 중이에요…');
    try {
        await requestApi({action: 'requestCode', email});
        document.querySelector('[data-login-code-form]').hidden = false;
        document.querySelector('[data-login-email-form]').hidden = true;
        setLoginStatus(`${email}로 인증번호를 보냈어요. 메일이 안 보이면 스팸함도 확인해 주세요.`);
        document.querySelector('[data-login-code]').focus();
    } catch (err) {
        setLoginStatus(err.message || '인증번호를 보내지 못했어요.', true);
    } finally {
        sendEl.disabled = false;
    }
}

async function handleVerify(event) {
    event.preventDefault();
    const codeEl = document.querySelector('[data-login-code]');
    const verifyEl = document.querySelector('[data-login-verify]');
    const code = codeEl.value.replace(/\D/g, '');
    if (code.length !== 6) {
        setLoginStatus('인증번호 6자리를 입력해 주세요.', true);
        codeEl.focus();
        return;
    }
    verifyEl.disabled = true;
    try {
        const email = document.querySelector('[data-login-email]').value.trim().toLowerCase();
        const data = await requestApi({action: 'verify', email, code});
        writeStorage(SESSION_KEY, {token: data.token, email: data.email});
        codeEl.value = '';
        setLoginStatus('');
        showApp();
    } catch (err) {
        setLoginStatus(err.message || '인증하지 못했어요.', true);
        codeEl.select();
    } finally {
        verifyEl.disabled = false;
    }
}

async function handleLogout() {
    try {
        await requestApi({action: 'logout'});
    } catch (err) {
        // 서버에서 못 지워도 이 브라우저에서는 로그아웃해요
    }
    showLogin();
}

// ---- 이벤트 ----
async function handleSubmit(event) {
    event.preventDefault();
    const urlEl = document.querySelector('[data-add-url]');
    const authorEl = document.querySelector('[data-add-author]');
    const submitEl = document.querySelector('[data-add-submit]');
    const url = normalizeUrl(urlEl.value);
    const author = authorEl.value.trim();
    // 지금 보고 있는 탭에 넣어요. 레퍼런스 사이트(REFERENCE_HOSTS)는 늘 '보고 배우기'로 가요
    const space = guessSpace(url) === 'learn' ? 'learn' : state.space;

    if (!url) {
        setStatus('올바른 URL을 입력해 주세요.', true);
        urlEl.focus();
        return;
    }
    if (!author) {
        setStatus('작성자를 입력해 주세요.', true);
        authorEl.focus();
        return;
    }

    writeStorage(AUTHOR_KEY, author);
    submitEl.disabled = true;
    setStatus(API_URL ? '페이지를 읽는 중이에요…' : '등록하는 중이에요…');
    try {
        const item = await addItem(url, author, space);
        // 등록한 공간 탭으로 옮겨서, 다른 사람이 등록한 것까지 함께 새로 불러와요
        state.space = spaceOf(item);
        writeStorage(SPACE_KEY, state.space);
        await refresh();
        setStatus(`'${SPACE_NAMES[state.space]}'에 등록했어요: ${item.title}`);
        urlEl.value = '';
        urlEl.focus();
    } catch (err) {
        if (err instanceof AuthError) showLogin(err.message);
        else setStatus(err.message || '등록하지 못했어요.', true);
    } finally {
        submitEl.disabled = false;
    }
}

async function handleListClick(event) {
    const moveBtn = event.target.closest('[data-move-id]');
    if (moveBtn) {
        moveBtn.disabled = true;
        try {
            await moveItem(moveBtn.dataset.moveId, moveBtn.dataset.moveTo);
            await refresh();
            setStatus(`'${SPACE_NAMES[moveBtn.dataset.moveTo]}'로 옮겼어요.`);
        } catch (err) {
            moveBtn.disabled = false;
            if (err instanceof AuthError) showLogin(err.message);
            else setStatus(err.message || '옮기지 못했어요.', true);
        }
        return;
    }
    const delBtn = event.target.closest('[data-delete-id]');
    if (!delBtn) return;
    if (!window.confirm('이 북마크를 삭제할까요?')) return;
    delBtn.disabled = true;
    try {
        await deleteItem(delBtn.dataset.deleteId);
        await refresh();
        setStatus('삭제했어요.');
    } catch (err) {
        delBtn.disabled = false;
        if (err instanceof AuthError) showLogin(err.message);
        else setStatus(err.message || '삭제하지 못했어요.', true);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('[data-notice]').hidden = Boolean(API_URL);
    state.space = SPACE_NAMES[readStorage(SPACE_KEY, 'use')] ? readStorage(SPACE_KEY, 'use') : 'use';

    const tabs = [...document.querySelectorAll('[data-tab]')];
    tabs.forEach((tab) => tab.addEventListener('click', () => setSpace(tab.dataset.tab)));
    // 탭 사이는 ← → 키로 옮겨요
    document.querySelector('.tabs').addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        const next = tabs[(tabs.findIndex((tab) => tab.dataset.tab === state.space) + 1) % tabs.length];
        setSpace(next.dataset.tab);
        next.focus();
    });
    const authorEl = document.querySelector('[data-add-author]');
    authorEl.value = readStorage(AUTHOR_KEY, '');
    // 작성자 이름을 넣으면 바로 기억해서, 그 이름으로 올린 카드에 삭제 버튼을 보여줘요
    authorEl.addEventListener('input', () => {
        writeStorage(AUTHOR_KEY, authorEl.value.trim());
        render();
    });

    document.querySelector('[data-add-form]').addEventListener('submit', handleSubmit);
    document.querySelector('[data-list]').addEventListener('click', handleListClick);
    const searchEl = document.querySelector('[data-search]');
    searchEl.addEventListener('input', () => {
        state.query = searchEl.value;
        render();
    });
    // / 키로 바로 검색, Esc로 지우기
    searchEl.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        searchEl.value = '';
        state.query = '';
        render();
    });
    document.addEventListener('keydown', (event) => {
        if (event.key !== '/' || event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.target.closest('input, textarea, select, [contenteditable]')) return;
        event.preventDefault();
        searchEl.focus();
        searchEl.select();
    });

    // 회사 메일 인증: 체험 모드(API_URL 없음)는 인증 없이 바로 열어요
    document.querySelector('[data-login-email-form]').addEventListener('submit', handleSendCode);
    document.querySelector('[data-login-code-form]').addEventListener('submit', handleVerify);
    document.querySelector('[data-login-again]').addEventListener('click', () => showLogin());
    document.querySelector('[data-logout]').addEventListener('click', handleLogout);
    if (!API_URL || readStorage(SESSION_KEY, {}).token) showApp();
    else showLogin();
});
</script>
</body>
</html>
